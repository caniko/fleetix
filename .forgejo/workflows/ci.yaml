# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: |
          nix fmt -- --check .
          nix develop -c cargo fmt --all -- --check

      - name: Check flake
        run: nix flake check

      - name: Test
        run: nix develop -c cargo test --all-features

      - name: Check cargo-audit tool
        run: nix develop -c command -v cargo-audit

      - name: Check MSRV (Rust 1.88)
        run: nix develop .#msrv -c cargo check --all-targets --all-features

      - name: Check current stable (Rust 1.96)
        run: nix develop .#stable -c cargo check --all-targets --all-features

      - name: Check library without CLI
        run: nix develop -c cargo check --all-targets --no-default-features

      - name: Fetch RustSec advisory database
        run: |
          db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          rm -rf "$db"
          mkdir -p "$(dirname "$db")"
          git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 clone --depth 1 https://github.com/RustSec/advisory-db.git "$db"

      - name: Audit dependencies
        run: |
          db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          nix develop -c cargo audit --db "$db" --no-fetch --stale

      - name: Build docs
        run: nix develop -c cargo doc --no-deps --all-features

      - name: Clippy
        run: nix develop -c cargo clippy --all-targets --all-features -- --deny warnings

      - name: Check package publication policy
        run: |
          nix develop -c cargo metadata --no-deps --format-version 1 \
            | sed -n '/^{/,$p' \
            | jq -e '.packages | length == 1 and .[0].publish == []'
