# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
    branches:
      - "trunk"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        installable:
          - ".#packages.x86_64-linux.fleetixCrate"
          - ".#packages.x86_64-linux.fleetix-sidecar"
          - ".#checks.x86_64-linux.fleetix-tests"
          - ".#checks.x86_64-linux.fleetix-clippy"
          - ".#checks.x86_64-linux.fleetix-no-default-features"
          - ".#checks.x86_64-linux.fleetix-publication-policy"
          - ".#checks.x86_64-linux.fleetix-fmt"
          - ".#checks.x86_64-linux.build-train-policy"
          - ".#checks.x86_64-linux.build-train-module"
          - ".#checks.x86_64-linux.gpu-contract"
          - ".#checks.x86_64-linux.gatus-profiles"
          - ".#checks.x86_64-linux.publication-projections"
          - ".#checks.x86_64-linux.mcp-adapters"
          - ".#checks.x86_64-linux.validate-example-export"
          - ".#checks.x86_64-linux.validate-modular-aggregate-export"
          - ".#checks.x86_64-linux.fleetix-lib-helpers"
          - ".#checks.x86_64-linux.module-integration-fixtures"
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare Nix build evidence
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          SIMIT_NIX_BUILD_RESULTS="$RUNNER_TEMP/simit-nix-build-${{ strategy.job-index }}"
          printf '%s\n' "SIMIT_NIX_BUILD_RESULTS=$SIMIT_NIX_BUILD_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$SIMIT_NIX_BUILD_RESULTS"
          git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
          printf '%s\n' "$INSTALLABLE" > "$SIMIT_NIX_BUILD_RESULTS/installable"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Project setup
        run: |
          set -eu
          bash scripts/qualify-hosted-source.sh
          {
            printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
            printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
            printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
          } >> "$GITHUB_ENV"
          if [ -n "${SIMIT_NIX_BUILD_RESULTS:-}" ]; then
            cp "$SIMIT_NIX_BUILD_RESULTS/revision" "$SIMIT_NIX_BUILD_RESULTS/checkout-revision"
            expected="${GITHUB_SHA:?}"
            if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
              expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            fi
            test "$(git rev-parse HEAD)" = "$expected"
            git diff --exit-code HEAD --
            git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
            git rev-parse 'HEAD^{tree}' > "$SIMIT_NIX_BUILD_RESULTS/tree"
          fi

      - name: Build ${{ matrix.installable }}
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          set -euo pipefail
          exec 3> >(tee "$SIMIT_NIX_BUILD_RESULTS/build.log" >&2)
          log_pid=$!
          status=0
          nix build --no-link --no-update-lock-file --max-jobs 1 --cores 2 --print-build-logs --json "$INSTALLABLE" 2>&3 | tee "$SIMIT_NIX_BUILD_RESULTS/result.json" || status=$?
          exec 3>&-
          wait "$log_pid"
          exit "$status"
      - name: Upload Nix build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        with:
          name: nix-build-${{ strategy.job-index }}
          retention-days: 32
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/simit-nix-build-${{ strategy.job-index }}
            /nix/var/log/nix/drvs
