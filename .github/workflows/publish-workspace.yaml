# Generated by simit. Manual edits will be reported as ci=drift.
# coordinated workspace publish: prerequisites before dependents.
# Before creating and pushing a release tag, run `simit changelog release <version>` locally.
# Required release trust roots and secrets:
# - keys/maintainers.gpg: pinned maintainer OpenPGP public keys for git verify-tag.
name: Publish Workspace

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate signed release tag and lockstep versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2; exit 1; fi
          test -s keys/maintainers.gpg
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          gpg --batch --import keys/maintainers.gpg
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"
          validated_sha="$(git rev-list -n 1 "$tag")"
          test "$validated_sha" = "${GITHUB_SHA:?missing workflow event SHA}" || { echo "Signed tag commit does not match the workflow event SHA; refusing a moved tag" >&2; exit 1; }
          git checkout --detach "$validated_sha"
          test "$(nix develop -c cargo pkgid -p fleetix-sidecar | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "fleetix-sidecar 0.6.0 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p fleetix | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "fleetix 0.6.0 does not match tag $tag" >&2; exit 1; }
  publish-fleetix-sidecar:
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Package archive with verification
        run: nix develop -c cargo package -p fleetix-sidecar --allow-dirty

      - name: Registry dry-run
        run: nix develop -c cargo publish -p fleetix-sidecar --dry-run

      - name: Publish
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          set -euo pipefail
          crate_name='fleetix-sidecar'
          version="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          if [ -z "$version" ]; then echo "Could not determine release version from tag ref" >&2; exit 1; fi
          # Preflight: fail fast on auth/ownership/validation vs propagation delay.
          if [ -z "${CRATES_IO_API_TOKEN:-}" ] && [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then echo "CRATES_IO_API_TOKEN is required to publish to crates.io" >&2; exit 1; fi
          export CARGO_REGISTRY_TOKEN="${CARGO_REGISTRY_TOKEN:-$CRATES_IO_API_TOKEN}"
          status="$(curl --retry 3 -sS -o /tmp/simit-crate.json -w '%{http_code}' -A 'simit publish-workspace preflight' "https://crates.io/api/v1/crates/${crate_name}/${version}" || echo 000)"
          case "$status" in
            200)
              echo "${crate_name} ${version} already exists on crates.io; verifying it is the intended release"
              published_checksum="$(jq -er --arg v "$version" '.version | select(.num == $v) | .checksum' /tmp/simit-crate.json 2>/dev/null || true)"
              local_crate="target/package/${crate_name}-${version}.crate"
              if [ -n "$published_checksum" ] && [ -f "$local_crate" ]; then
                local_checksum="$(sha256sum "$local_crate" | awk '{print $1}')"
                if [ "$local_checksum" = "$published_checksum" ]; then echo "checksum matches; resuming (already published)"; exit 0; fi
              fi
              echo "conflict: ${crate_name} ${version} exists but checksum does not match the local archive; refusing to treat as success" >&2; exit 1;;
            404) ;;
            401|403) echo "authorization/ownership failure checking ${crate_name} ${version} (HTTP $status)" >&2; exit 1;;
            *) echo "Could not check crates.io for ${crate_name} ${version} before publishing (HTTP $status)" >&2; exit 1;;
          esac
          nix develop -c cargo publish -p fleetix-sidecar

      - name: Wait for exact registry resolution
        run: |
          set -euo pipefail
          crate_name='fleetix-sidecar'
          version="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          mkdir "$probe/src"
          touch "$probe/src/lib.rs"
          printf '[package]\nname = "simit-registry-probe"\nversion = "0.0.0"\nedition = "2021"\n[workspace]\n[dependencies]\n%s = { version = "=%s", registry = "crates-io", default-features = false }\n' "$crate_name" "$version" > "$probe/Cargo.toml"
          # The web API may be ready before the index. Fetch an exact registry
          # dependency from a workspace-isolated manifest, without a cached lock.
          # Cargo.lock retains binary-only packages too; metadata omits them.
          for attempt in $(seq 1 20); do
            rm -f "$probe/Cargo.lock"
            if timeout --kill-after=5s 60s nix develop -c cargo fetch --manifest-path "$probe/Cargo.toml" > "$probe/fetch.log" 2> "$probe/error.log" && awk -v wanted_name="$crate_name" -v wanted_version="$version" '
              function matches() { return name == wanted_name && version == wanted_version && source == "registry+https://github.com/rust-lang/crates.io-index" }
              /^\[\[package\]\]/ { if (matches()) found = 1; name = version = source = "" }
              /^(name|version|source) = "/ { value = $3; gsub(/"/, "", value); if ($1 == "name") name = value; else if ($1 == "version") version = value; else source = value }
              END { exit !(found || matches()) }
            ' "$probe/Cargo.lock"; then
              echo "resolved and fetched ${crate_name} ${version} from crates.io (attempt $attempt)"
              break
            fi
            cat "$probe/error.log" >&2
            if [ "$attempt" = 20 ]; then echo "registry resolution timeout for ${crate_name} ${version}" >&2; exit 1; fi
            echo "waiting for exact registry resolution of ${crate_name} ${version} (attempt $attempt/20)"
            sleep 30
          done

  publish-fleetix:
    needs: [publish-fleetix-sidecar]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Package archive with verification
        run: nix develop -c cargo package -p fleetix --allow-dirty

      - name: Registry dry-run
        run: nix develop -c cargo publish -p fleetix --dry-run

      - name: Publish
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          set -euo pipefail
          crate_name='fleetix'
          version="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          if [ -z "$version" ]; then echo "Could not determine release version from tag ref" >&2; exit 1; fi
          # Preflight: fail fast on auth/ownership/validation vs propagation delay.
          if [ -z "${CRATES_IO_API_TOKEN:-}" ] && [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then echo "CRATES_IO_API_TOKEN is required to publish to crates.io" >&2; exit 1; fi
          export CARGO_REGISTRY_TOKEN="${CARGO_REGISTRY_TOKEN:-$CRATES_IO_API_TOKEN}"
          status="$(curl --retry 3 -sS -o /tmp/simit-crate.json -w '%{http_code}' -A 'simit publish-workspace preflight' "https://crates.io/api/v1/crates/${crate_name}/${version}" || echo 000)"
          case "$status" in
            200)
              echo "${crate_name} ${version} already exists on crates.io; verifying it is the intended release"
              published_checksum="$(jq -er --arg v "$version" '.version | select(.num == $v) | .checksum' /tmp/simit-crate.json 2>/dev/null || true)"
              local_crate="target/package/${crate_name}-${version}.crate"
              if [ -n "$published_checksum" ] && [ -f "$local_crate" ]; then
                local_checksum="$(sha256sum "$local_crate" | awk '{print $1}')"
                if [ "$local_checksum" = "$published_checksum" ]; then echo "checksum matches; resuming (already published)"; exit 0; fi
              fi
              echo "conflict: ${crate_name} ${version} exists but checksum does not match the local archive; refusing to treat as success" >&2; exit 1;;
            404) ;;
            401|403) echo "authorization/ownership failure checking ${crate_name} ${version} (HTTP $status)" >&2; exit 1;;
            *) echo "Could not check crates.io for ${crate_name} ${version} before publishing (HTTP $status)" >&2; exit 1;;
          esac
          nix develop -c cargo publish -p fleetix

      - name: Wait for exact registry resolution
        run: |
          set -euo pipefail
          crate_name='fleetix'
          version="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          mkdir "$probe/src"
          touch "$probe/src/lib.rs"
          printf '[package]\nname = "simit-registry-probe"\nversion = "0.0.0"\nedition = "2021"\n[workspace]\n[dependencies]\n%s = { version = "=%s", registry = "crates-io", default-features = false }\n' "$crate_name" "$version" > "$probe/Cargo.toml"
          # The web API may be ready before the index. Fetch an exact registry
          # dependency from a workspace-isolated manifest, without a cached lock.
          # Cargo.lock retains binary-only packages too; metadata omits them.
          for attempt in $(seq 1 20); do
            rm -f "$probe/Cargo.lock"
            if timeout --kill-after=5s 60s nix develop -c cargo fetch --manifest-path "$probe/Cargo.toml" > "$probe/fetch.log" 2> "$probe/error.log" && awk -v wanted_name="$crate_name" -v wanted_version="$version" '
              function matches() { return name == wanted_name && version == wanted_version && source == "registry+https://github.com/rust-lang/crates.io-index" }
              /^\[\[package\]\]/ { if (matches()) found = 1; name = version = source = "" }
              /^(name|version|source) = "/ { value = $3; gsub(/"/, "", value); if ($1 == "name") name = value; else if ($1 == "version") version = value; else source = value }
              END { exit !(found || matches()) }
            ' "$probe/Cargo.lock"; then
              echo "resolved and fetched ${crate_name} ${version} from crates.io (attempt $attempt)"
              break
            fi
            cat "$probe/error.log" >&2
            if [ "$attempt" = 20 ]; then echo "registry resolution timeout for ${crate_name} ${version}" >&2; exit 1; fi
            echo "waiting for exact registry resolution of ${crate_name} ${version} (attempt $attempt/20)"
            sleep 30
          done

  publish-report:
    needs: [publish-fleetix]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Release result
        run: |
          set -euo pipefail
          echo "coordinated workspace publish finished (see per-crate job statuses for the auditable result)"
          echo "resume: re-dispatch this workflow; already-published crates with matching checksums exit 0, conflicts fail"
