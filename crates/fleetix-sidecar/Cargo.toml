[package]
name = "fleetix-sidecar"
version = "0.10.1"
edition = "2021"
rust-version = "1.88"
description = "Standalone Pkl-to-Nix sidecar generator and reusable Fleetix library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/fleetix"
documentation = "https://docs.rs/fleetix-sidecar"
readme = "README.md"
keywords = ["pkl", "nix", "config", "fleet"]
categories = ["config", "command-line-utilities"]
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE*", "/Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

# The default build ships this binary (`cli` is a default feature); it is not
# gated with `required-features` so release archives and cargo-binstall see it.
[[bin]]
name = "fleetix-sidecar"
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
pklx.workspace = true
tokio.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2.workspace = true
clap = { workspace = true, optional = true }

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/fleetix-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/fleetix-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/fleetix-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/fleetix-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
