[package]
name = "fleetix"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
description = "Fleet topology library — typed Pkl schema, Rust bindings, Nix modules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/fleetix"
homepage = "https://github.com/caniko/fleetix"
keywords = ["fleet", "topology", "nix", "pkl", "nixos"]
categories = ["config"]
readme = "README.md"
documentation = "https://docs.rs/fleetix"
include = [
  "/src/**",
  "/examples/**",
  "/lib/**",
  "/modules/**",
  "/tests/**",
  "/README.md",
  "/MCP.md",
  "/SERVICE_PROFILES.md",
  "/ARCHITECTURE.md",
  "/BUILD_TRAIN.md",
  "/CHANGELOG.md",
  "/LICENSE*",
  "/Cargo.toml",
  "/Cargo.lock",
]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [".", "crates/fleetix-sidecar"]
default-members = [".", "crates/fleetix-sidecar"]
resolver = "2"

[workspace.dependencies]
fleetix-sidecar = { version = "0.6.0", path = "crates/fleetix-sidecar", default-features = false }
pklx = "0.1.0"
miette = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "fleetix"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
fleetix-sidecar = { workspace = true, optional = true }
pklx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap = { version = "2", features = ["serde"] }
tempfile.workspace = true
sha2.workspace = true
toml_edit = { version = "0.23", features = ["serde"], optional = true }
fs2 = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
nix-manager-core = { version = "0.3.0", optional = true }
signal-hook = { version = "0.4", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "mcp", "pkl", "health"]
pkl = ["dep:pklx", "dep:tokio", "dep:fleetix-sidecar"]
health = ["pkl"]
mcp = ["dep:toml_edit", "dep:fs2"]
build-train-runtime = ["dep:fs2", "dep:libc"]
build-train-native = ["build-train-runtime", "dep:nix-manager-core"]
build-train-cli = ["build-train-native", "dep:clap", "dep:signal-hook"]

[dependencies.clap]
workspace = true
optional = true
