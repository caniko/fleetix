[package]
name = "fleetix"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Fleet topology library — typed Pkl schema, Rust bindings, Nix modules"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/fleetix"
homepage = "https://codeberg.org/caniko/fleetix"
keywords = ["fleet", "topology", "nix", "pkl", "nixos"]
categories = ["config"]
readme = "README.md"
publish = false

[[bin]]
name = "fleetix"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
pklx = { version = "0.1.0", git = "https://codeberg.org/caniko/nix-pklx.git" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
miette = "7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
rkyv = { version = "0.8", features = ["indexmap-2"] }
tempfile = "3"
sha2 = "0.10"

[dev-dependencies]
ron = "0.8"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true
