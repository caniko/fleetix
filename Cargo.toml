[package]
name = "fleetix"
version = "0.9.1"
edition = "2021"
rust-version = "1.88"
description = "Fleet topology library — typed Pkl schema, Rust bindings, Nix modules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/fleetix"
homepage = "https://github.com/caniko/fleetix"
keywords = ["fleet", "topology", "nix", "pkl", "nixos"]
categories = ["config"]
readme = "README.md"
documentation = "https://docs.rs/fleetix"
include = [
  "/src/**",
  "/examples/**",
  "/lib/**",
  "/modules/**",
  "/tests/**",
  "/README.md",
  "/MCP.md",
  "/MCP_SERVER.md",
  "/SERVICE_PROFILES.md",
  "/SERVICE_SURFACES.md",
  "/ARCHITECTURE.md",
  "/BUILD_TRAIN.md",
  "/DEPLOYMENT.md",
  "/SUPPLY.md",
  "/CHANGELOG.md",
  "/LICENSE*",
  "/Cargo.toml",
  "/Cargo.lock",
]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [".", "crates/fleetix-sidecar"]
default-members = [".", "crates/fleetix-sidecar"]
resolver = "2"

[workspace.dependencies]
fleetix-sidecar = { version = "0.9.1", path = "crates/fleetix-sidecar", default-features = false }
pklx = "0.2.1"
miette = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
# AsyncFd I/O safety fix (RUSTSEC-2026-0386).
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time"] }
clap = { version = "4", features = ["derive"] }

# The default build ships this binary (`cli` is a default feature); it is not
# gated with `required-features` so release archives and cargo-binstall see it.
[[bin]]
name = "fleetix"
path = "src/main.rs"

[[bin]]
name = "fleetix-deploy"
path = "src/bin/fleetix-deploy.rs"
required-features = ["deployment-cli"]

[[bin]]
name = "fleetix-surfaces"
path = "src/bin/fleetix-surfaces.rs"
required-features = ["service-surfaces-cli"]

[dependencies]
fleetix-sidecar = { workspace = true, optional = true }
pklx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap = { version = "2", features = ["serde"] }
tempfile.workspace = true
sha2.workspace = true
toml_edit = { version = "0.23", features = ["serde"], optional = true }
fs2 = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
nix-manager-core = { version = "0.4.2", optional = true }
signal-hook = { version = "0.4", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
ureq = { version = "3", features = ["json"], optional = true }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
tokio-util = { version = "0.7", features = ["codec", "io"], optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "mcp", "pkl", "health"]
pkl = ["dep:pklx", "dep:tokio", "dep:fleetix-sidecar"]
health = ["pkl", "dep:reqwest"]
forge = ["dep:ureq"]
mcp = ["dep:toml_edit", "dep:fs2"]
mcp-server = ["dep:rmcp", "dep:tokio", "dep:tokio-util", "dep:futures-util", "tokio/io-util", "tokio/io-std", "tokio/sync"]
build-train-runtime = ["dep:fs2", "dep:libc"]
build-train-native = ["build-train-runtime", "dep:nix-manager-core"]
build-train-cli = ["build-train-native", "dep:clap", "dep:signal-hook"]
deployment-runtime = ["dep:fs2", "dep:libc", "dep:signal-hook"]
deployment-cli = ["deployment-runtime", "dep:clap"]
service-surfaces-runtime = ["dep:fs2", "dep:libc"]
service-surfaces-cli = ["service-surfaces-runtime", "dep:clap"]

[dependencies.clap]
workspace = true
optional = true

[dev-dependencies]
rmcp = { version = "3.9.0", default-features = false, features = ["client", "server", "transport-io"] }

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/fleetix-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/fleetix-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/fleetix-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/fleetix-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
