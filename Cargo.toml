[package]
name = "fleetix"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Fleet topology library — typed Pkl schema, Rust bindings, Nix modules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/fleetix"
homepage = "https://github.com/caniko/fleetix"
keywords = ["fleet", "topology", "nix", "pkl", "nixos"]
categories = ["config"]
readme = "README.md"
documentation = "https://docs.rs/fleetix"
include = [
  "/src/**",
  "/examples/**",
  "/lib/**",
  "/modules/**",
  "/tests/**",
  "/README.md",
  "/MCP.md",
  "/SERVICE_PROFILES.md",
  "/ARCHITECTURE.md",
  "/CHANGELOG.md",
  "/LICENSE*",
  "/Cargo.toml",
  "/Cargo.lock",
]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "fleetix"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
pklx = { version = "0.1.0", optional = true }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
], optional = true }
miette = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
sha2 = "0.10"
toml_edit = { version = "0.23", features = ["serde"], optional = true }
fs2 = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "mcp", "pkl", "health"]
pkl = ["dep:pklx", "dep:tokio"]
health = ["pkl"]
mcp = ["dep:toml_edit", "dep:fs2"]
build-train-runtime = ["dep:fs2", "dep:libc"]

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true
