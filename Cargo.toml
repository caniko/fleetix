[package]
name = "fleetix"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Fleet topology library — typed Pkl schema, Rust bindings, Nix modules"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/fleetix"
homepage = "https://codeberg.org/caniko/fleetix"
keywords = ["fleet", "topology", "nix", "pkl", "nixos"]
categories = ["config"]
readme = "README.md"

[dependencies]
pklx = { git = "https://codeberg.org/caniko/nix-pklx.git" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
miette = "7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
rkyv = { version = "0.8", features = ["indexmap-2"] }

[dev-dependencies]
ron = "0.8"
tempfile = "3"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true
