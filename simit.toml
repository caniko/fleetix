[ci]
workspace = true
workspace_strategy = "aggregate"
# Validate PR heads once (pull_request); push runs cover trunk and the simit
# updater's candidate refs, which never have a PR. With no push runs on PR
# heads, push and PR runs never share a concurrency ref, so separate_events
# (65b1360) has nothing left to separate.
push_branches = ["trunk", "simit/update/**"]
publish_strategy = "coordinated"
runner = "ubuntu-24.04"
with_msrv = true
with_audit = true
with_docs = true
runtime = "nix"
platform = "github"
provider = "actions"
publish_crates = true
nix_builds = [".#packages.x86_64-linux.fleetixCrate", ".#packages.x86_64-linux.fleetix-sidecar", ".#checks.x86_64-linux.fleetix-tests", ".#checks.x86_64-linux.fleetix-clippy", ".#checks.x86_64-linux.fleetix-no-default-features", ".#checks.x86_64-linux.fleetix-publication-policy", ".#checks.x86_64-linux.fleetix-fmt", ".#checks.x86_64-linux.binstall-metadata-fleetix", ".#checks.x86_64-linux.binstall-metadata-fleetix-sidecar", ".#checks.x86_64-linux.build-train-policy", ".#checks.x86_64-linux.build-train-module", ".#checks.x86_64-linux.gpu-contract", ".#checks.x86_64-linux.gatus-profiles", ".#checks.x86_64-linux.publication-projections", ".#checks.x86_64-linux.mcp-adapters", ".#checks.x86_64-linux.validate-example-export", ".#checks.x86_64-linux.validate-modular-aggregate-export", ".#checks.x86_64-linux.fleetix-lib-helpers", ".#checks.x86_64-linux.module-integration-fixtures", ".#checks.x86_64-linux.deployment-runtime", ".#checks.x86_64-linux.service-surfaces-module", ".#checks.x86_64-linux.service-surfaces-vm", ".#checks.x86_64-linux.boot-operations-vm"]
extra_env = { CARGO_BUILD_JOBS = "2", RUST_TEST_THREADS = "2", RUSTDOCFLAGS = "-D warnings" }
extra_setup = ['''
set -eu
bash scripts/qualify-hosted-source.sh
# The primary CI also runs nix flake check, including the real deployment VM.
test -c /dev/kvm
sudo chmod a+rw /dev/kvm
test -r /dev/kvm && test -w /dev/kvm
{
  printf '%s\n' 'NIX_CONFIG<<SIMIT_HOSTED_NIX_CONFIG'
  printf '%s\n' 'experimental-features = nix-command flakes' 'max-jobs = 1' 'cores = 2' 'log-lines = 200'
  printf '%s\n' 'SIMIT_HOSTED_NIX_CONFIG'
} >> "$GITHUB_ENV"
if [ -n "${SIMIT_NIX_BUILD_RESULTS:-}" ]; then
  cp "$SIMIT_NIX_BUILD_RESULTS/revision" "$SIMIT_NIX_BUILD_RESULTS/checkout-revision"
  expected="${GITHUB_SHA:?}"
  if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
    expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
  fi
  test "$(git rev-parse HEAD)" = "$expected"
  git diff --exit-code HEAD --
  git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
  git rev-parse 'HEAD^{tree}' > "$SIMIT_NIX_BUILD_RESULTS/tree"
fi
''']

[ci.nix_build]
kvm = true
push_branches = ["trunk", "simit/update/**"]
capture_results = true
timeout_minutes = 60
max_parallel = 2
max_jobs = 1
cores = 2
artifact_retention_days = 32
artifact_paths = ["/nix/var/log/nix/drvs"]

# Trunk pushes publish the Linux package Canix consumes to the public canix
# cache; pull requests only build.
[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
# Push runs cover trunk and the simit updater's candidate branches; PRs
# still build.
push_branches = ["trunk", "simit/update/**"]
nix_builds = [".#packages.x86_64-linux.fleetixCrate"]

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[release.github]
repo = "caniko/fleetix"
target_branch = "trunk"

[release.artifacts]
runner = "ubuntu-24.04"
# Prebuilt cargo-binstall archives: static musl Linux for x86_64 and aarch64.
# One job per system, merged into the single release; `simit binstall sync`
# keeps the crate metadata equal.
prebuild_binaries = true
binstall = true
system_runners = { x86_64-linux = "ubuntu-24.04" }
# No keys/minisign.pub trust root in this repository.
sign = false
substituters = [
  "https://attic.candee.baby/canix",
  "https://cache.nixos.org",
]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "fleetix"
token_secret = "ATTIC_TOKEN"

[[ci.required_gates]]
id = "generated-parity"
run = "bash scripts/qualify-hosted-source.sh && nix run --max-jobs 1 --cores 2 github:caniko/simit/b7657ee584edeab792ca34e28eb2fcde63673433 -- init ci --platform github --ci-provider actions --runtime nix --check --diff"
timeout_minutes = 30
